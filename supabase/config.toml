project_id = "veyro-live"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[functions.if-oauth-start]
verify_jwt = true

[functions.if-oauth-callback]
verify_jwt = false

[functions.if-api]
verify_jwt = true

[functions.booking-request]
verify_jwt = true

[functions.discord-interactions]
verify_jwt = false

[functions.sync-approval]
verify_jwt = true

[functions.health]
verify_jwt = false
